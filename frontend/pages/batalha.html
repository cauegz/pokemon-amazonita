<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>batalha</title>
    <link rel="stylesheet" href="../css/batalha.css">
</head>
<body>
    <div id="gameContainer">
        <div class="pokemonsEmBatalha">
            <div class="pokemon" id="pokeOponente">
                <span id="pokeInimigo"></span>
                <div class="pokeInfo" id="pokeInimigoInfo">
                    <span id="pokeNomeInimigo"></span>
                    <span id="hpInimigo"></span>
                </div>
            </div>
        
            <div class="pokemon" id="pokeUser">
                <span id="pokeSelecionado"></span>
                <div class="pokeInfo" id="pokeUserInfo">
                    <span id="pokeNome"></span>
                    <span id="hp"></span>
                </div>
            </div>
        </div>
        <div id="menuBatalha">
            <p id="mensagemBatalha"></p>
            <div id="opcoesBatalha">
                <button class="btn-opc" id="atacar">Atacar</button>
                <button class="btn-opc" id="fugir">Fugir</button>
                <button class="btn-opc" id="trocar" popovertarget="trocaPokeAtivo" >Trocar</button>
                <button class="btn-opc" id="mochila" popovertarget="abreMochila">Mochila</button>
            </div>
            <button id="voltar">voltar</button>
        </div>
        <div id="trocaPokeAtivo" popover="auto">
            <button class="close-popover" popovertargetaction="hide"  popovertarget="trocaPokeAtivo" id="fecharPopover">Fechar</button>
            <p>Escolha um Pokémon para entrar na batalha</p>
            <div id="time"></div>
        </div>
        <div id="abreMochila" popover="auto">
            <button class="close-popover" popovertargetaction="hide"  popovertarget="abreMochila" id="fecharPopover">Fechar</button>
            <p>Escolha um item para usar</p>
            <div id="itens"></div>

        </div>

    </div>
   
    <script src="../js/pages/batalha.js" type="module"></script>
</body>
</html>
