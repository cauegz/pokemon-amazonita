<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monstrobolso</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <img id="player" src="../images/sprites/player-sprites.png" alt="Player Sprite" >

    <div class="camada-interface">
        <div class="interface-mapa" data-mapa-id="2">
            <h1 class="nome-area">
                Pokemart e Centro Pokemon
            </h1>
            <a href="./loja.html" class="botao-mapa" id="poke-mart">
                PokeMart
            </a>
            <a class="botao-mapa" id="centro-pokemon">
                Centro Pokemon
            </a>
            <a href="./builder.html" class="botao-mapa" id="team-builder">
                Team Builder
            </a>

        </div>
        <div class="interface-mapa" data-mapa-id="0" hidden>
            <h1 class="nome-area">
                Ribeirinhos
                <p class="mensagem-missao"> <i class="fa-solid fa-compass"></i>Batalhe com Marcio Bigolin</p>
            </h1>
            <button data-id="1" class="btn-escolher">
                <img src="../images/npcs/sprite-bigolin.png">
            </button>
        </div>
        <div class="interface-mapa" data-mapa-id="1" hidden>
            <h1 class="nome-area">
                Museu
                <p class="mensagem-missao"> <i class="fa-solid fa-compass"></i>Batalhe com Raissa Scheeren</p>
            </h1>
            <button data-id="2" class="btn-escolher">
                <img src="../images/npcs/sprite-raissa.png">
            </button>
        </div>
        <div class="interface-mapa" data-mapa-id="3" hidden>
            <h1 class="nome-area">
                Lago
                <p class="mensagem-missao"> <i class="fa-solid fa-compass"></i>Batalhe com Jacqueline Akazaki</p>
            </h1>
            <button data-id="3" class="btn-escolher">
              <img src="../images/npcs/sprite-jaque.png">
            </button>
        </div>
    </div>

    <script type="module" src="../js/pages/main.js"></script>
    <script type="module" src="../js/pages/mapa.js"></script>
    <script src="https://kit.fontawesome.com/20f8a440c6.js" crossorigin="anonymous"></script>
</body>
</html>
